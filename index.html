<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA — Premium Fashion & Apparel</title>
    <link rel="stylesheet" href="./catalog.css">
    <link rel="stylesheet" href="./index.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="logo">AURA<span>.</span></div>
        <nav class="nav-menu">
            <a href="#" class="active">Головна</a>
            <a href="./catalog.html">Каталог</a>
            <a href="./catalog.html#about">Про нас</a>
        </nav>
        <div class="header-actions">
            <div class="search-box">
                <i class='bx bx-search'></i>
                <input type="text" id="search-input" placeholder="Пошук одягу..." onkeyup="filterProducts()">
            </div>
            <button class="icon-btn cart-trigger" onclick="toggleCart()">
                <i class='bx bx-shopping-bag'></i>
                <span class="badge" id="cart-count">0</span>
            </button>
        </div>
    </header>
    <section class="hero">
        <div class="hero-content">
            <h1>Стиль, який підкреслює тебе</h1>
            <p>Відкрий нову колекцію сучасного одягу для кожного дня.</p>
            <a href="#" class="hero-button">Переглянути колекцію</a>
        </div>
    </section>


</body>

</html>
